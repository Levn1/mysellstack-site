<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · MySellStack Appointments</title>
  <meta name="description" content="This page doesn't exist. Head back to the MySellStack Appointments homepage or help center.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f7e54'/%3E%3Crect x='14' y='16' width='36' height='34' rx='6' fill='white'/%3E%3Cpath d='M14 22a6 6 0 0 1 6-6h24a6 6 0 0 1 6 6v6H14z' fill='%23dcece4'/%3E%3Crect x='22' y='11' width='4' height='9' rx='2' fill='white'/%3E%3Crect x='38' y='11' width='4' height='9' rx='2' fill='white'/%3E%3Ccircle cx='36.5' cy='42.5' r='7.5' fill='%230f7e54'/%3E%3Cpath d='M32.8 42.6l2.6 2.6 4.6-5' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <!-- GitHub Pages serves this page for ANY missing URL at any depth, so
       relative paths are unreliable here. Everything is self-contained
       (inline styles, system fonts) and links are resolved to the site
       base by the tiny script below. -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #2e3d35; background: #fbfdfc; min-height: 100vh;
      display: grid; place-items: center; text-align: center; padding: 24px;
    }
    .kicker { font-size: .78rem; font-weight: 700; letter-spacing: .09em;
      text-transform: uppercase; color: #0f7e54; margin-bottom: 10px; }
    h1 { color: #132019; font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800; }
    p { margin: 16px auto 28px; color: #5f7268; }
    .btn { display: inline-block; background: #0f7e54; color: #fff;
      padding: 12px 22px; border-radius: 10px; text-decoration: none;
      font-weight: 600; margin: 0 6px 10px; }
    .btn:hover { background: #0a5c3e; }
    .ghost { background: transparent; color: #0a5c3e;
      border: 1.5px solid #dfe9e3; }
    .ghost:hover { background: #edf6f1; }
  </style>
</head>
<body>
  <main>
    <div class="kicker">404</div>
    <h1>That page isn’t here</h1>
    <p>The link may be old, or the page may have moved.</p>
    <p>
      <a class="btn" id="home-link" href="/">Back to the homepage</a>
      <a class="btn ghost" id="help-link" href="/help/index.html">Browse the help center</a>
    </p>
  </main>
  <script>
    // Resolve the site base: on <user>.github.io project hosting the site
    // lives under /<repo>/; on a custom domain (or user site) it's /.
    (function () {
      var base = "/";
      if (location.hostname.endsWith(".github.io")) {
        var seg = location.pathname.split("/")[1];
        if (seg) base = "/" + seg + "/";
      }
      document.getElementById("home-link").href = base;
      document.getElementById("help-link").href = base + "help/index.html";
    })();
  </script>
</body>
</html>
