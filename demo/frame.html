<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking widget demo</title>
  <link rel="stylesheet" href="widget.css?v=5">
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body>
  <div id="mount"></div>
  <script src="demo-data.js?v=4"></script>
  <script src="demo-shim.js?v=3"></script>
  <script>
    // Mount the inline widget for the product in the query string. The
    // shim has already read ?theme= and patched fetch, so the real
    // widget bundle below boots exactly as it would on a storefront.
    (function () {
      var params = new URLSearchParams(location.search);
      var DATA = window.__BW_DEMO_DATA__;
      var pid = params.get("product") || "15000934023279";
      var p = DATA.products[pid] || DATA.products["15000934023279"];
      var el = document.createElement("div");
      el.setAttribute("data-booking-widget-inline", "");
      el.setAttribute("data-product-id", pid);
      el.setAttribute("data-product-price", p.price);
      el.setAttribute("data-product-price-cents", String(p.cents));
      el.setAttribute("data-product-currency", "USD");
      document.getElementById("mount").appendChild(el);
      // Paint the frame in the theme's background so nothing white
      // peeks around the widget inside the rounded stage.
      var theme = DATA.themes[params.get("theme") || "sunset"];
      if (theme) document.body.style.background = theme.backgroundColor || "#fff";
      // Keep the parent's stage exactly as tall as the widget.
      var report = function () {
        parent.postMessage({ bwDemoHeight: document.body.scrollHeight }, "*");
      };
      if ("ResizeObserver" in window) {
        new ResizeObserver(report).observe(document.body);
      } else {
        setInterval(report, 600);
      }
      window.addEventListener("load", report);
    })();
  </script>
  <script src="widget.js?v=5" defer></script>
</body>
</html>
